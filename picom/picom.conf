#################################
#          Backend              #
#################################

backend = "glx";         # Use glx to support real transparency

vsync = true;
use-damage = true;
experimental-backends = true

#################################
#         Shadow Settings       #
#################################

shadow = false;
#shadow-radius = 7;
#shadow-offset-x = -7;
#shadow-offset-y = -7;

# Optional: if you want to tweak shadow color
# shadow-color = "#000000"

#################################
#         Fading                #
#################################

fading = false;
#fade-in-step = 0.03;
#fade-out-step = 0.03;

#################################
#     Opacity + Transparency    #
#################################

frame-opacity = 1.0;
incative-opacity = 1.0;
active-opacity = 1.0;
opacity-rule = [];  # No special transparency rules — handled by RGBA in apps

#################################
#           Corners             #
#################################

corner-radius = 0;

#################################
#            Blur               #
#################################

# Blur disabled for now
# To enable later, uncomment and configure:
 blur-method = "dual_kawase";
 blur-strength = 5;

 blur-background-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

#################################
#         Window Rules          #
#################################

rules = (
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
  }
);

#################################
#         Detection Tweaks      #
#################################

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

